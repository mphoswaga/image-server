<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colony Quest · Test a raid</title><link rel="stylesheet" href="/colonyquest-raid-story.css?v=3"><style>body{font:18px system-ui;background:#edf4ed;color:#173e35;margin:0;padding:30px}main{max-width:680px;margin:7vh auto}button,a{font:inherit;padding:14px 20px;border-radius:10px;border:1px solid #9ab7a8;margin:6px;cursor:pointer}button{background:#17684e;color:white}#close{position:fixed;right:15px;bottom:12px;z-index:200;background:#fff;color:#173e35;font-size:14px}label{display:block;margin:22px 6px}p{line-height:1.6}</style></head><body><main><p>COLONY QUEST · RAID PREVIEW</p><h1>Test the student raid screen</h1><p>Watch the approach, clash and result using sample students Mia and Leo. This preview does not change any class, marks or game.</p><label><input id="sound" type="checkbox" checked> Play raid drums and shield-clash sounds</label><button id="attack">Test attacker wins</button><button id="defend">Test defender wins</button><p id="status" role="status">Choose an outcome to start the preview.</p></main><button id="close" hidden>Close raid preview</button><script src="/colonyquest-raid-story.js?v=2"></script><script>
const story=new ColonyRaidStory();let timer;const close=document.getElementById('close');
function finish(){clearInterval(timer);story.hide();close.hidden=true;document.getElementById('status').textContent='Preview complete. Choose another outcome to replay.';}
function start(success){finish();const duration=8400,start=performance.now();story.configure(document.getElementById('sound').checked,.7);close.hidden=false;const event={id:'preview-'+Date.now(),attacker:'mia',target:'leo',attackerName:'Mia',targetName:'Leo',success,stolen:success?5:0,attackerFoodChange:success?5:0,targetFoodChange:success?-5:5};function update(){const remaining=Math.max(0,duration-(performance.now()-start));story.sync({id:'preview',phase:'raidWatching',serverNow:Date.now(),me:{id:success?'mia':'leo'},raid:{event,remaining}});if(!remaining)finish();}update();timer=setInterval(update,100);}
document.getElementById('attack').onclick=()=>start(true);document.getElementById('defend').onclick=()=>start(false);close.onclick=finish;document.getElementById('sound').onchange=e=>story.configure(e.target.checked,.7);
</script></body></html>
