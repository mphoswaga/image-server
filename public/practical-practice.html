<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project practice · LessonScope</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#f2f7f4;color:#173d36;margin:0}
header{background:#123e38;color:white;padding:16px 24px}header a{color:white;font-weight:800;text-decoration:none}
main{max-width:950px;margin:auto;padding:24px 20px 60px}h1{font:700 clamp(28px,4vw,40px)/1.15 Georgia,serif;margin:8px 0}
.intro{color:#47645c;margin-bottom:22px}.practice-card{background:white;border:1px solid #cadfd2;border-radius:16px;padding:clamp(16px,3vw,26px);box-shadow:0 6px 22px #153d3510}
.practice-card[hidden]{display:none}h2{font:700 25px/1.2 Georgia,serif;margin:0 0 8px}.instructions{color:#47645c}
button,select,input{font:inherit}button{border:1px solid #b6cfc2;border-radius:8px;background:white;color:#174b3d;padding:10px 15px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}.check{background:#17664e;color:white;border-color:#17664e;font-weight:700;margin-top:14px}
.feedback{padding:10px 12px;border-radius:8px;background:#edf6ef;min-height:1.5em}.feedback:empty{display:none}
.project-data-scroll{overflow:auto;margin:12px 0}th,td{padding:8px;border:1px solid #c8ded5}table{border-collapse:collapse;width:100%}
.project-task-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}.project-task-nav span{font-weight:700}
.project-codequest-frame{width:100%;height:720px;border:0;border-radius:12px}
.grade-links{display:flex;gap:12px;flex-wrap:wrap}.grade-links a{background:#17664e;color:white;padding:13px 18px;border-radius:8px;text-decoration:none;font-weight:700}
</style>
<link rel="stylesheet" href="/practical-activities.css?v=8">
</head>
<body><header><a href="/">LessonScope</a></header><main>
<h1 id="title">Project practice</h1><p class="intro" id="intro">Choose your practice adventure.</p>
<div id="practiceTasks"></div></main>
<script src="/codequest-core.js"></script><script src="/assessment-codequest.js?v=5"></script>
<script src="/assessment-data-table.js?v=6"></script><script src="/practical-task-pager.js?v=2"></script><script src="/practical-practice.js?v=2"></script>
</body></html>
