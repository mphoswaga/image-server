<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project practice · LessonScope</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#f2f7f4;color:#173d36;margin:0}
header{background:#123e38;color:white;padding:16px 24px}header a{color:white;font-weight:800;text-decoration:none}
main{max-width:950px;margin:auto;padding:24px 20px 60px}h1{font:700 clamp(28px,4vw,40px)/1.15 Georgia,serif;margin:8px 0}
.intro{color:#47645c;margin-bottom:22px}.practice-card{background:white;border:1px solid #cadfd2;border-radius:16px;padding:clamp(16px,3vw,26px);box-shadow:0 6px 22px #153d3510}
.practice-card[hidden]{display:none}h2{font:700 25px/1.2 Georgia,serif;margin:0 0 8px}.instructions{color:#47645c}
button,select,input{font:inherit}button{border:1px solid #b6cfc2;border-radius:8px;background:white;color:#174b3d;padding:10px 15px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}.check{background:#17664e;color:white;border-color:#17664e;font-weight:700;margin-top:14px}
.feedback{padding:10px 12px;border-radius:8px;background:#edf6ef;min-height:1.5em}.feedback:empty{display:none}
.project-data-scroll{overflow:auto;margin:12px 0}th,td{padding:8px;border:1px solid #c8ded5}table{border-collapse:collapse;width:100%}
.project-task-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}.project-task-nav span{font-weight:700}
.project-codequest-frame{width:100%;height:720px;border:0;border-radius:12px}
.grade-links{display:flex;gap:12px;flex-wrap:wrap}.grade-links a{background:#17664e;color:white;padding:13px 18px;border-radius:8px;text-decoration:none;font-weight:700}

.practice-card>strong:first-child{color:#21645b;font-size:.88rem}
.practice-card .lab-records .project-data-source{display:flex;flex-wrap:wrap;gap:16px}
.practice-card .lab-records .project-data-source li{position:relative;box-sizing:border-box;width:min(100%,330px);border-radius:15px;border:1px solid #a8c9c0;background:linear-gradient(115deg,#fdfaf1,#e7f3ef);padding:52px 18px 16px 74px;box-shadow:0 3px 8px #174a3c20}
.practice-card .lab-records .project-data-source li:before{content:'GRADE 3 · PUPIL REGISTER';position:absolute;inset:0 0 auto;background:#155d56;color:white;padding:9px 16px;font:bold 12px system-ui;letter-spacing:.13em;border-radius:14px 14px 0 0}
.practice-card .lab-records .project-data-source li:after{content:'📚';position:absolute;top:52px;left:12px;background:#d4e7dc;border-radius:50%;padding:8px;font-size:24px}
.practice-card .lab-types .lab-exhibits li:before{content:'▦';font-size:24px;color:#247966}
.practice-card .lab-survey meter{height:22px}
.practice-card .unit-order li{background:linear-gradient(110deg,#e7f1ef,#f5f9fc);border-left:5px solid #39798a}
.practice-card .unit-handle{padding:14px 5px}
.practice-card .unit-handle:before{content:'⠿ ';font-size:1.3em}

.practice-card .unit-order li{touch-action:none;cursor:grab}
.practice-card:has(.unit-order) .instructions,.practice-card:has(.lab-types) .instructions,.practice-card:has(.lab-survey) .instructions{padding:14px 12px 14px 84px;min-height:58px;background:#eff6f4 left 10px center/62px auto no-repeat;border-radius:9px}
.practice-card:has(.unit-order) .instructions{background-image:url('/assets/practice/sprites-g3/file-folder-open.webp')}
.practice-card:has(.lab-types) .instructions{background-image:url('/assets/practice/sprites-g3/school-document.webp')}
.practice-card:has(.lab-survey) .instructions{background-image:url('/assets/practice/sprites-g3/rapid-relay.webp')}
.practice-card .lab-survey .lab-exhibits li{border-top-color:#725e99}.practice-card .lab-survey meter{accent-color:#67599a}
.practice-card .lab-records .project-data-source li:before{background:linear-gradient(105deg,#11534d,#2c7772);padding-top:10px}
.voyage-rules{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 14px;padding:12px 12px 12px 66px;background:#fff4d7 url(/assets/codequest/treasure.svg) 10px center/44px auto no-repeat;border-radius:10px}.voyage-rules strong{padding:3px 10px;border:1px solid #bd9453;border-radius:6px;background:#fffcf3;color:#483316}.voyage-rules small{color:#514936}
</style>
