<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Assignment — LessonScope</title>
  <style>
    :root { --primary:#1a56a0; --accent:#e8833a; --ink:#1c2331; --muted:#6b7280; --border:#dde3ec; --err:#c0392b; --ok:#1f9d55; --bg:#f4f6fb; --sh:0 2px 12px rgba(0,0,0,.10); }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); min-height:100vh; color:var(--ink); padding:20px; }
    .wrap { max-width:640px; margin:0 auto; }
    .card { background:#fff; border-radius:16px; box-shadow:var(--sh); padding:28px; margin-bottom:20px; }
    h1 { font-size:22px; font-weight:800; margin-bottom:6px; }
    .sub { color:var(--muted); font-size:14px; }
    .q { padding:18px 0; border-top:1px solid var(--border); }
    .q:first-of-type { border-top:none; }
    .qtext { font-weight:600; margin-bottom:10px; font-size:15px; }
    .marks { color:var(--muted); font-size:12.5px; font-weight:500; }
    .opts { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    .opt { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; cursor:pointer; font-size:14px; }
    .opt:hover { border-color:var(--primary); }
    .opt.sel { border-color:var(--primary); background:#eaf1fb; }
    .opt input { accent-color:var(--primary); }
    textarea { width:100%; min-height:70px; padding:10px 12px; font-size:14px; font-family:inherit; border:1.5px solid var(--border); border-radius:10px; resize:vertical; }
    textarea:focus { outline:none; border-color:var(--primary); }
    .btn { display:inline-block; padding:13px 22px; font-size:15px; font-weight:700; border:none; border-radius:12px; cursor:pointer; background:var(--primary); color:#fff; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .err { color:var(--err); font-size:13px; margin-top:12px; }
    .center { text-align:center; padding:40px 20px; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; margin-right:8px; vertical-align:-2px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .result-score { font-size:38px; font-weight:800; color:var(--primary); }
    .result-grade { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; padding:14px 0; border-top:1px solid var(--border); }
    .result-grade:first-of-type { border-top:none; }
    .verdict { font-size:12.5px; font-weight:700; border-radius:20px; padding:3px 10px; white-space:nowrap; }
    .verdict.correct { background:#e5f7ec; color:var(--ok); }
    .verdict.partial { background:#fdf3e2; color:#b26a00; }
    .verdict.incorrect { background:#fdeeee; color:var(--err); }
    .rationale { color:var(--muted); font-size:13px; margin-top:4px; }
    .my-answer { background:#f4f6fb; border-radius:8px; padding:8px 10px; margin-top:8px; font-size:13.5px; }
    .my-answer b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; margin-bottom:2px; }
    .feedback { display:flex; gap:6px; margin-top:8px; font-size:13px; color:var(--muted); font-style:italic; }
    .feedback .fb-icon { flex-shrink:0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading" class="card center">Loading…</div>

    <div id="authScreen" class="card" style="display:none">
      <h1>Join this assignment</h1>
      <p class="sub" id="authSub">Enter your Student ID to continue.</p>
      <form id="authForm" style="margin-top:16px">
        <label for="auSid" id="sidLabel" style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Student ID</label>
        <input id="auSid" type="text" placeholder="e.g. STU-99432" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="40" required style="width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px" />

        <div id="pinSetupBlock" style="display:none">
          <p class="sub" style="margin:0 0 10px">First time — create a 4-digit PIN. You'll use this to get back in next time.</p>
          <label for="auPinNew" style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Create a 4-digit PIN</label>
          <input id="auPinNew" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" style="width:100%;padding:12px 14px;font-size:20px;letter-spacing:6px;text-align:center;border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;font-family:ui-monospace,monospace" />
          <label for="auPinConfirm" style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Confirm PIN</label>
          <input id="auPinConfirm" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" style="width:100%;padding:12px 14px;font-size:20px;letter-spacing:6px;text-align:center;border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px;font-family:ui-monospace,monospace" />
        </div>

        <div id="pinEnterBlock" style="display:none">
          <label for="auPin" style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Your PIN</label>
          <input id="auPin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" style="width:100%;padding:12px 14px;font-size:20px;letter-spacing:6px;text-align:center;border:1.5px solid var(--border);border-radius:10px;margin-bottom:6px;font-family:ui-monospace,monospace" />
          <button type="button" id="forgotPinBtn" style="background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;padding:0 0 14px;display:block">Forgot your PIN?</button>
        </div>

        <button class="btn" id="authBtn" type="submit">Continue</button>
        <div class="err" id="authErr"></div>
        <div class="err" id="forgotMsg" style="color:var(--ok)"></div>
      </form>
    </div>

    <div id="form" style="display:none">
      <div class="card">
        <h1 id="title"></h1>
        <p class="sub" id="instructions"></p>
      </div>
      <div class="card" id="questions"></div>
      <div class="card">
        <button class="btn" id="submitBtn">Submit</button>
        <div class="err" id="submitErr"></div>
      </div>
    </div>

    <div id="results" style="display:none">
      <div class="card center" id="scoreWrap">
        <div class="result-score"><span id="scoreVal"></span></div>
        <p class="sub">out of <span id="scoreMax"></span> marks</p>
      </div>
      <div class="card center" id="pendingMsg" style="display:none">
        <h1>Submitted</h1>
        <p class="sub" id="pendingSub">Your teacher hasn't released marks for this assignment yet — check back once it's been reviewed.</p>
      </div>
      <div class="card" id="gradeBreakdown"></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const assignmentId = location.pathname.split('/').pop();
    let questions = [];
    const answers = {};
    const draftKey = 'lessonscope_assignment_draft_' + assignmentId;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    // The generator sometimes bakes "(N marks)" into the question text itself;
    // strip it since the marks badge is always rendered separately below.
    function stripMarks(q) { return String(q || '').replace(/\s*\(\d+\s*marks?\)\s*$/i, ''); }
    function saveDraft() {
      try { localStorage.setItem(draftKey, JSON.stringify({ answers, savedAt: Date.now() })); } catch {}
    }
    function restoreDraft() {
      try {
        const saved = JSON.parse(localStorage.getItem(draftKey) || '{}');
        if (saved && saved.answers && typeof saved.answers === 'object') Object.assign(answers, saved.answers);
      } catch {}
    }
    function clearDraft() {
      try { localStorage.removeItem(draftKey); } catch {}
    }

    function renderQuestions() {
      $('questions').innerHTML = questions.map((q, i) => {
        if (q.kind === 'mcq') {
          const saved = Number(answers[q.id]);
          return `<div class="q">
            <div class="qtext">${i + 1}. ${esc(stripMarks(q.question))} <span class="marks">(${q.marks} mark${q.marks !== 1 ? 's' : ''})</span></div>
            <div class="opts" data-qid="${q.id}">
              ${(q.options || []).map((o, j) => `<label class="opt${saved === j ? ' sel' : ''}" data-i="${j}"><input type="radio" name="${q.id}" value="${j}"${saved === j ? ' checked' : ''}> ${esc(o)}</label>`).join('')}
            </div>
          </div>`;
        }
        return `<div class="q">
          <div class="qtext">${i + 1}. ${esc(stripMarks(q.question))} <span class="marks">(${q.marks} mark${q.marks !== 1 ? 's' : ''})</span></div>
          <textarea data-qid="${q.id}" placeholder="Type your answer…">${esc(answers[q.id] || '')}</textarea>
        </div>`;
      }).join('');

      $('questions').querySelectorAll('.opts').forEach(box => {
        box.addEventListener('click', e => {
          const opt = e.target.closest('.opt');
          if (!opt) return;
          box.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
          opt.classList.add('sel');
          opt.querySelector('input').checked = true;
          answers[box.dataset.qid] = Number(opt.dataset.i);
          saveDraft();
        });
      });
      $('questions').querySelectorAll('textarea').forEach(ta => {
        ta.addEventListener('input', () => { answers[ta.dataset.qid] = ta.value; saveDraft(); });
      });
    }

    // Students always see their own answers; marks/rationale only render
    // once the assignment is released (d.released) or overdue — d.grades is
    // null from the server in that case, so `g` stays undefined and no
    // verdict badge is shown, just the plain answer.
    function renderResults(d, givenAnswers) {
      $('form').style.display = 'none';
      $('scoreWrap').style.display = d.released ? 'block' : 'none';
      $('pendingMsg').style.display = d.released ? 'none' : 'block';
      if (d.released) { $('scoreVal').textContent = d.totalMarks; $('scoreMax').textContent = d.maxMarks; }
      $('gradeBreakdown').innerHTML = questions.map((q, i) => {
        const given = givenAnswers ? givenAnswers[q.id] : undefined;
        const answerText = q.kind === 'mcq' ? (q.options && given != null ? q.options[given] : '(no answer)') : (given || '(no answer)');
        const g = d.released && d.grades ? (d.grades[q.id] || {}) : null;
        return `<div class="result-grade">
          <div style="flex:1">
            <div class="qtext" style="margin-bottom:2px">${i + 1}. ${esc(stripMarks(q.question))}</div>
            <div class="my-answer"><b>Your answer</b>${esc(String(answerText))}</div>
            ${g && g.rationale ? `<div class="feedback"><span class="fb-icon">💬</span><span>${esc(g.rationale)}</span></div>` : ''}
          </div>
          ${g ? `<div style="text-align:right;flex-shrink:0"><span class="verdict ${esc(g.verdict || '')}">${g.marksAwarded}/${q.marks}</span></div>` : ''}
        </div>`;
      }).join('');
      $('results').style.display = 'block';
    }

    async function init() {
      try {
        const metaRes = await fetch('/api/assignment/' + assignmentId);
        if (metaRes.status === 401) {
          // No session yet (or it expired) — this happens whenever the raw
          // link is opened directly instead of via /join. Prompt inline
          // rather than rendering a broken/partial form.
          $('loading').style.display = 'none';
          $('authScreen').style.display = 'block';
          if (prefillSid) { $('auSid').value = prefillSid; $('authForm').requestSubmit(); }
          return;
        }
        const meta = await metaRes.json();
        if (!metaRes.ok) throw new Error(meta.error || 'Could not load this assignment.');
        $('title').textContent = meta.title || 'Assignment';
        $('instructions').textContent = meta.instructions || '';
        if (meta.hasRoster === false) {
          $('sidLabel').textContent = 'Your name';
          $('auSid').placeholder = 'First and last name';
          $('authSub').textContent = 'Type your name to continue.';
        }

        const takeRes = await fetch('/api/assignment/' + assignmentId + '/take');
        const take = await takeRes.json();
        if (!takeRes.ok) throw new Error(take.error || 'Could not load the questions.');
        questions = take.questions;
        $('loading').style.display = 'none';

        if (take.alreadySubmitted) {
          const myRes = await fetch('/api/assignment/' + assignmentId + '/my-results');
          const my = await myRes.json();
          if (!myRes.ok) throw new Error(my.error || 'Could not load your submission.');
          renderResults(my, my.answers);
          return;
        }

        restoreDraft();
        renderQuestions();
        $('form').style.display = 'block';
      } catch (err) {
        $('loading').style.display = 'block';
        $('authScreen').style.display = 'none';
        $('loading').textContent = err.message || 'Could not load this assignment.';
      }
    }

    const prefillSid = new URLSearchParams(location.search).get('sid');
    if (prefillSid) $('auSid').value = prefillSid.toUpperCase();

    // Tracks which step we're on so a resubmit sends the right fields —
    // null (just Student ID) -> 'setup' (first-time PIN creation) or
    // 'enter' (existing PIN) once the server tells us which.
    let authStep = null;

    function showPinSetup() { authStep = 'setup'; $('pinSetupBlock').style.display = 'block'; $('pinEnterBlock').style.display = 'none'; $('auPinNew').focus(); }
    function showPinEnter() { authStep = 'enter'; $('pinEnterBlock').style.display = 'block'; $('pinSetupBlock').style.display = 'none'; $('auPin').focus(); }

    $('authForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('authBtn'); btn.disabled = true; $('authErr').textContent = ''; $('forgotMsg').textContent = '';
      const studentId = $('auSid').value.trim().toUpperCase();
      // Sent alongside the key so a teacher's results read "Ama Okafor", not AMAOKAFOR.
      const typedName = $('auSid').value.trim();
      if (!studentId) { $('authErr').textContent = 'Please enter your ID.'; btn.disabled = false; return; }

      let pin;
      if (authStep === 'setup') {
        const p1 = $('auPinNew').value.trim(), p2 = $('auPinConfirm').value.trim();
        if (!/^\d{4}$/.test(p1)) { $('authErr').textContent = 'PIN must be exactly 4 digits.'; btn.disabled = false; return; }
        if (p1 !== p2) { $('authErr').textContent = "PINs don't match."; btn.disabled = false; return; }
        pin = p1;
      } else if (authStep === 'enter') {
        pin = $('auPin').value.trim();
        if (!/^\d{4}$/.test(pin)) { $('authErr').textContent = 'Enter your 4-digit PIN.'; btn.disabled = false; return; }
      }

      try {
        const r = await fetch('/api/assignment/' + assignmentId + '/enter', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, name: typedName, pin }),
        });
        const d = await r.json();
        if (r.status === 428 && d.needsPinSetup) { showPinSetup(); btn.disabled = false; return; }
        if (r.status === 428 && d.needsPin) { showPinEnter(); btn.disabled = false; return; }
        if (!r.ok) throw new Error(d.error);
        $('authScreen').style.display = 'none';
        $('loading').style.display = 'block'; $('loading').textContent = 'Loading…';
        init();
      } catch (err) { $('authErr').textContent = err.message; }
      btn.disabled = false;
    });

    $('forgotPinBtn').addEventListener('click', async () => {
      const studentId = $('auSid').value.trim().toUpperCase();
      // Sent alongside the key so a teacher's results read "Ama Okafor", not AMAOKAFOR.
      const typedName = $('auSid').value.trim();
      if (!studentId) { $('authErr').textContent = 'Enter your Student ID first.'; return; }
      const btn = $('forgotPinBtn'); btn.disabled = true;
      try {
        const r = await fetch('/api/assignment/' + assignmentId + '/pin/reset-request', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, name: typedName }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        $('forgotMsg').textContent = "Your teacher has been notified — check back with them, then try again once they've cleared it.";
      } catch (err) { $('authErr').textContent = err.message; }
      btn.disabled = false;
    });

    $('submitBtn').addEventListener('click', async () => {
      const btn = $('submitBtn'); btn.disabled = true; $('submitErr').textContent = '';
      btn.innerHTML = '<span class="spinner"></span>Submitting…';
      try {
        const r = await fetch('/api/assignment/' + assignmentId + '/submit', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        clearDraft();
        renderResults(d, answers);
      } catch (err) {
        $('submitErr').textContent = err.message;
        btn.disabled = false; btn.textContent = 'Submit';
      }
    });

    init();
  </script>
</body>
</html>
